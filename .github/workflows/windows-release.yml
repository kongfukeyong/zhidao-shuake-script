name: Windows portable release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --onefile --name ZhiDao-Helper --collect-all tiktoken --collect-all openai main.py
          New-Item -ItemType Directory -Force -Path release/ZhiDao-Helper | Out-Null
          Copy-Item dist/ZhiDao-Helper.exe, meta.json, README.md, LICENSE -Destination release/ZhiDao-Helper
          Copy-Item exam -Destination release/ZhiDao-Helper/exam -Recurse
          if (Test-Path release/ZhiDao-Helper/config.json) { throw 'Private config included' }
          Push-Location release
          try {
            & 'C:\Program Files\7-Zip\7z.exe' a -tzip -mx=1 ../ZhiDao-Helper-win64.zip ZhiDao-Helper | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'ZIP creation failed' }
          } finally { Pop-Location }
          $zip = Resolve-Path ZhiDao-Helper-win64.zip
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          gh release create v0.1.0 $zip --repo $env:GITHUB_REPOSITORY --target master --title 'Windows 便携版 v0.1.0' --notes "基于 qwe0305/zhidao-shuake-script。解压后运行 ZhiDao-Helper.exe；首次启动会在 exe 旁生成 config.json。章节测试辅助脚本在 exam/，使用它们需要 Python。SHA-256: $digest"
          Write-Output "SHA-256: $digest"
        env:
          GH_TOKEN: ${{ github.token }}
